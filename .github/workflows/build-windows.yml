name: Build AndroidDriveTime

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Prepare vendored Dokan SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $archive = "$env:GITHUB_WORKSPACE\third_party\dokan-sdk-2.3.1.1000-win64.zip"
          $dst = "C:\Program Files\Dokan\DokanLibrary-2.3.1"

          if (-not (Test-Path $archive)) {
            throw "Vendored Dokan archive not found: $archive"
          }

          Write-Host "Using vendored Dokan archive:"
          Get-Item $archive | Select-Object FullName, Length

          New-Item -ItemType Directory -Force $dst | Out-Null

          Expand-Archive `
            -Path $archive `
            -DestinationPath $dst `
            -Force

          Write-Host "Dokan SDK contents:"
          Get-ChildItem $dst -Recurse |
            Select-Object FullName, Length

          $required = @(
            "$dst\include\dokan\dokan.h",
            "$dst\include\dokan\fileinfo.h",
            "$dst\include\dokan\public.h",
            "$dst\lib\dokan2.lib",
            "$dst\dokan2.dll"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required Dokan file missing: $file"
            }
          }

          Write-Host "Vendored Dokan SDK validated successfully."

      - name: Configure
        shell: powershell
        run: |
          cmake `
            -S sources `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        shell: powershell
        run: |
          cmake `
            --build build `
            --config Release

      - name: Prepare portable package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $artifact = "$env:GITHUB_WORKSPACE\artifact"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifact |
            Out-Null

          $exe = "$env:GITHUB_WORKSPACE\build\Release\AndroidDrive.exe"

          if (-not (Test-Path $exe)) {
            throw "AndroidDrive.exe not found: $exe"
          }

          Copy-Item `
            $exe `
            "$artifact\AndroidDriveTime.exe"

          $deploy = "$env:GITHUB_WORKSPACE\build\windeployqt"

          if (Test-Path $deploy) {
            Copy-Item `
              "$deploy\*" `
              "$artifact\" `
              -Recurse `
              -Force
          }

          Write-Host "Portable package contents:"
          Get-ChildItem $artifact -Recurse |
            Select-Object FullName, Length

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: AndroidDriveTime-portable
          path: artifact
