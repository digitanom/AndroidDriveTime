name: Build AndroidDriveTime

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

        - name: Prepare Dokan 2.3.1 SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $version = "v2.3.1.1000"
          $work = "$env:RUNNER_TEMP\dokan-sdk"
          $dst = "C:\Program Files\Dokan\DokanLibrary-2.3.1"

          New-Item -ItemType Directory -Force "$work\src" | Out-Null
          New-Item -ItemType Directory -Force "$work\bin" | Out-Null
          New-Item -ItemType Directory -Force "$dst\include\dokan" | Out-Null
          New-Item -ItemType Directory -Force "$dst\lib" | Out-Null

          Write-Host "Downloading Dokany source..."
          Invoke-WebRequest `
            -Uri "https://github.com/dokan-dev/dokany/archive/refs/tags/$version.zip" `
            -OutFile "$work\dokan-source.zip"

          Write-Host "Downloading Dokany binary package..."
          Invoke-WebRequest `
            -Uri "https://github.com/dokan-dev/dokany/releases/download/$version/dokan.zip" `
            -OutFile "$work\dokan-bin.zip"

          Expand-Archive "$work\dokan-source.zip" "$work\src" -Force
          Expand-Archive "$work\dokan-bin.zip" "$work\bin" -Force

          # Headers
          $dokanHeader = Get-ChildItem "$work\src" -Recurse -Filter "dokan.h" |
            Where-Object { $_.Directory.Name -eq "dokan" } |
            Select-Object -First 1

          if (-not $dokanHeader) {
            throw "dokan.h not found in Dokany source"
          }

          Write-Host "Headers found at:"
          Write-Host $dokanHeader.Directory.FullName

          Copy-Item `
            -Path (Join-Path $dokanHeader.Directory.FullName "*.h") `
            -Destination "$dst\include\dokan" `
            -Force

          # x64 import library
          $dokanLib = Get-ChildItem "$work\bin" -Recurse -Filter "dokan2.lib" |
            Where-Object {
              $_.FullName -match '[\\/]x64[\\/]' -and
              $_.FullName -match '[\\/]Release[\\/]'
            } |
            Select-Object -First 1

          if (-not $dokanLib) {
            Write-Host "Available dokan2.lib files:"
            Get-ChildItem "$work\bin" -Recurse -Filter "dokan2.lib" |
              Select-Object FullName
            throw "x64 Release dokan2.lib not found"
          }

          Copy-Item $dokanLib.FullName "$dst\lib\dokan2.lib" -Force

          # x64 DLL
          $dokanDll = Get-ChildItem "$work\bin" -Recurse -Filter "dokan2.dll" |
            Where-Object {
              $_.FullName -match '[\\/]x64[\\/]' -and
              $_.FullName -match '[\\/]Release[\\/]'
            } |
            Select-Object -First 1

          if (-not $dokanDll) {
            Write-Host "Available dokan2.dll files:"
            Get-ChildItem "$work\bin" -Recurse -Filter "dokan2.dll" |
              Select-Object FullName
            throw "x64 Release dokan2.dll not found"
          }

          Copy-Item $dokanDll.FullName "$dst\dokan2.dll" -Force

          Write-Host "Prepared Dokan SDK:"
          Get-ChildItem "$dst" -Recurse | Select-Object FullName

      - name: Configure
        shell: powershell
        run: |
          cmake -S sources -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        shell: powershell
        run: |
          cmake --build build --config Release

      - name: Prepare portable package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact

          Copy-Item `
            "build\Release\AndroidDrive.exe" `
            "artifact\AndroidDriveTime.exe"

          if (Test-Path "build\windeployqt") {
            Copy-Item "build\windeployqt\*" "artifact\" -Recurse -Force
          }

          Write-Host "Artifact contents:"
          Get-ChildItem artifact -Recurse

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: AndroidDriveTime-portable
          path: artifact
