name: Build AndroidDriveTime

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Install Dokan 2.3.1
        shell: powershell
        run: |
          choco install dokany2 --version=2.3.1.1000 -y

          $root = "C:\Program Files\Dokan"
          $dst = "$root\DokanLibrary-2.3.1"

          New-Item -ItemType Directory -Force "$dst\include\dokan" | Out-Null
          New-Item -ItemType Directory -Force "$dst\lib" | Out-Null

          $dokanH = Get-ChildItem $root -Recurse -Filter dokan.h | Select-Object -First 1
          $fileinfoH = Get-ChildItem $root -Recurse -Filter fileinfo.h | Select-Object -First 1
          $publicH = Get-ChildItem $root -Recurse -Filter public.h | Select-Object -First 1
          $dokanLib = Get-ChildItem $root -Recurse -Filter dokan2.lib | Select-Object -First 1
          $dokanDll = Get-ChildItem $root -Recurse -Filter dokan2.dll | Select-Object -First 1

          if (-not $dokanH) { throw "dokan.h not found" }
          if (-not $fileinfoH) { throw "fileinfo.h not found" }
          if (-not $publicH) { throw "public.h not found" }
          if (-not $dokanLib) { throw "dokan2.lib not found" }

          Copy-Item $dokanH.FullName "$dst\include\dokan\dokan.h"
          Copy-Item $fileinfoH.FullName "$dst\include\dokan\fileinfo.h"
          Copy-Item $publicH.FullName "$dst\include\dokan\public.h"
          Copy-Item $dokanLib.FullName "$dst\lib\dokan2.lib"

          if ($dokanDll) {
            Copy-Item $dokanDll.FullName "$dst\dokan2.dll"
          }

          Write-Host "Prepared Dokan SDK:"
          Get-ChildItem "$dst" -Recurse

      - name: Configure
        shell: powershell
        run: |
          cmake -S sources -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        shell: powershell
        run: |
          cmake --build build --config Release

      - name: Prepare portable package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact

          Copy-Item `
            "build\Release\AndroidDrive.exe" `
            "artifact\AndroidDriveTime.exe"

          if (Test-Path "build\windeployqt") {
            Copy-Item "build\windeployqt\*" "artifact\" -Recurse -Force
          }

          Write-Host "Artifact contents:"
          Get-ChildItem artifact -Recurse

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: AndroidDriveTime-portable
          path: artifact
