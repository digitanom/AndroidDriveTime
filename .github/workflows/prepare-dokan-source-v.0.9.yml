name: Prepare Dokan Source v0.9

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Vendor exact Dokany source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dstDir = "$env:GITHUB_WORKSPACE\third_party"
          $dst = "$dstDir\dokany-source-v2.3.1.1000.zip"

          New-Item -ItemType Directory -Force $dstDir | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/dokan-dev/dokany/archive/refs/tags/v2.3.1.1000.zip" `
            -OutFile $dst

          Write-Host "Vendored source archive:"
          Get-Item $dst | Select-Object FullName, Length

      - name: Commit vendored source
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add third_party/dokany-source-v2.3.1.1000.zip

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Dokany source archive already up to date."
            exit 0
          }

          git commit -m "Vendor Dokany 2.3.1 source"
          git push
