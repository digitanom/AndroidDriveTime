name: Prepare Dokan Vendor v0.8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Dokan SDK
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $version = "v2.3.1.1000"
          $work = "$env:RUNNER_TEMP\dokan"
          $out = "$work\vendor"
          $repoThirdParty = "$env:GITHUB_WORKSPACE\third_party"

          New-Item -ItemType Directory -Force "$work\binary" | Out-Null
          New-Item -ItemType Directory -Force "$out\include\dokan" | Out-Null
          New-Item -ItemType Directory -Force "$out\lib" | Out-Null
          New-Item -ItemType Directory -Force "$repoThirdParty" | Out-Null

          Write-Host "Downloading Dokany headers..."

          Invoke-WebRequest `
            "https://raw.githubusercontent.com/dokan-dev/dokany/$version/dokan/dokan.h" `
            -OutFile "$out\include\dokan\dokan.h"

          Invoke-WebRequest `
            "https://raw.githubusercontent.com/dokan-dev/dokany/$version/dokan/fileinfo.h" `
            -OutFile "$out\include\dokan\fileinfo.h"

          Invoke-WebRequest `
            "https://raw.githubusercontent.com/dokan-dev/dokany/$version/sys/public.h" `
            -OutFile "$out\include\dokan\public.h"

          Write-Host "Downloading Dokany binary package..."

          Invoke-WebRequest `
            "https://github.com/dokan-dev/dokany/releases/download/$version/dokan.zip" `
            -OutFile "$work\dokan.zip"

          Expand-Archive `
            "$work\dokan.zip" `
            "$work\binary" `
            -Force

          Write-Host "Searching for x64 dokan2.lib..."

          $libs = Get-ChildItem `
            "$work\binary" `
            -Recurse `
            -Filter "dokan2.lib"

          $lib = $libs |
            Where-Object {
              $_.FullName -match '[\\/]x64[\\/]'
            } |
            Select-Object -First 1

          if (-not $lib) {
            Write-Host "Available dokan2.lib files:"
            $libs | Select-Object FullName
            throw "x64 dokan2.lib not found"
          }

          Write-Host "Using library:"
          Write-Host $lib.FullName

          Copy-Item `
            $lib.FullName `
            "$out\lib\dokan2.lib" `
            -Force

          Write-Host "Searching for x64 dokan2.dll..."

          $dlls = Get-ChildItem `
            "$work\binary" `
            -Recurse `
            -Filter "dokan2.dll"

          $dll = $dlls |
            Where-Object {
              $_.FullName -match '[\\/]x64[\\/]'
            } |
            Select-Object -First 1

          if (-not $dll) {
            Write-Host "Available dokan2.dll files:"
            $dlls | Select-Object FullName
            throw "x64 dokan2.dll not found"
          }

          Write-Host "Using DLL:"
          Write-Host $dll.FullName

          Copy-Item `
            $dll.FullName `
            "$out\dokan2.dll" `
            -Force

          Write-Host "Downloading license..."

          Invoke-WebRequest `
            "https://raw.githubusercontent.com/dokan-dev/dokany/$version/license.lgpl.txt" `
            -OutFile "$out\LICENSE-DOKAN-LGPL.txt"

          @"
          Dokany SDK files vendored for AndroidDriveTime

          Version: 2.3.1.1000
          Tag: v2.3.1.1000

          Included:
          - include/dokan/dokan.h
          - include/dokan/fileinfo.h
          - include/dokan/public.h
          - lib/dokan2.lib
          - dokan2.dll

          Original project:
          https://github.com/dokan-dev/dokany
          "@ | Set-Content "$out\SOURCE.txt"

          Write-Host "Vendor contents:"
          Get-ChildItem "$out" -Recurse |
            Select-Object FullName, Length

          $archive = "$repoThirdParty\dokan-sdk-2.3.1.1000-win64.zip"

          if (Test-Path $archive) {
            Remove-Item $archive -Force
          }

          Compress-Archive `
            -Path "$out\*" `
            -DestinationPath $archive `
            -Force

          Write-Host "Created:"
          Get-Item $archive |
            Select-Object FullName, Length

      - name: Commit Dokan vendor archive
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add third_party/dokan-sdk-2.3.1.1000-win64.zip

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Vendor archive already exists and is unchanged."
            exit 0
          }

          git commit -m "Vendor Dokan 2.3.1 SDK"
          git push
