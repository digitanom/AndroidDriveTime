'@

          Write-Host "Source changes applied successfully."

      - name: Commit source changes
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add `
            sources/settings.hpp `
            sources/settings.cpp `
            sources/settingswindow.hpp `
            sources/settingswindow.cpp `
            sources/dokanoperations.cpp

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw "No source changes were produced."
          }

          git commit -m "Add configurable Android ChangeTime support"

      - name: Generate cumulative patch against original fork baseline
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $creationCommit = git log `
            --all `
            --format="%H" `
            --grep="Fallback creation time to modification time" `
            -1

          if (-not $creationCommit) {
            throw "Could not find the earlier CreationTime fallback commit."
          }

          $base = git rev-parse "$creationCommit^"
          Write-Host "Original baseline commit: $base"

          New-Item -ItemType Directory -Force "patches" | Out-Null

          $patchText = git diff `
            $base `
            HEAD `
            -- `
            sources/settings.hpp `
            sources/settings.cpp `
            sources/settingswindow.hpp `
            sources/settingswindow.cpp `
            sources/dokanoperations.cpp | Out-String

          $patchPath = Join-Path $env:GITHUB_WORKSPACE "patches\androiddrive-time-support.patch"
          [System.IO.File]::WriteAllText(
            $patchPath,
            $patchText,
            [System.Text.UTF8Encoding]::new($false)
          )

          if (-not (Test-Path "patches/androiddrive-time-support.patch")) {
            throw "Cumulative patch was not created."
          }

          Write-Host "Cumulative patch:"
          Get-Content "patches/androiddrive-time-support.patch"

      - name: Commit cumulative patch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          git add patches/androiddrive-time-support.patch

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Cumulative patch unchanged."
          }
          else {
            git commit -m "Add cumulative AndroidDriveTime patch"
          }

          git push
