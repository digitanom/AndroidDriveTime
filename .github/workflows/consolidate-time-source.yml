name: Consolidate AndroidDriveTime source changes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply time settings directly to source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          function Replace-Exact {
            param(
              [string]$Path,
              [string]$Old,
              [string]$New
            )

            $text = Get-Content $Path -Raw

            if (-not $text.Contains($Old)) {
              throw "Expected source text not found in $Path`n--- expected ---`n$Old"
            }

            $text = $text.Replace($Old, $New)
            Set-Content $Path $text -NoNewline
          }

          # settings.hpp
          Replace-Exact `
            "sources/settings.hpp" `
            @'
    void setHideDotFiles(bool hideDotFiles);

    /**
     * Gets the language that the tray icon settings windows should be displayed in.
'@ `
            @'
    void setHideDotFiles(bool hideDotFiles);

    /**
     * Checks whether Android ctime should be exposed as Windows Change Time.
     *
     * @return True to preserve Android ctime, false to report Last Write Time
     *         as Change Time (original AndroidDrive behaviour).
     */
    bool preserveChangeTime() const;
    /**
     * Sets whether Android ctime should be exposed as Windows Change Time.
     *
     * @param preserveChangeTime - True to preserve Android ctime.
     */
    void setPreserveChangeTime(bool preserveChangeTime);

    /**
     * Gets the language that the tray icon settings windows should be displayed in.
'@

          # settings.cpp
          Replace-Exact `
            "sources/settings.cpp" `
            @'
void Settings::setHideDotFiles(bool hideDotFiles){
    this->_settings.setValue("hideDotFiles", hideDotFiles);
}

QString Settings::language() const{
'@ `
