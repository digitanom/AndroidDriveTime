          Replace-Exact `
            "sources/dokanoperations.cpp" `
            @'
        findData.nFileSizeHigh = fileSize.HighPart;
        findData.nFileSizeLow = fileSize.LowPart;
        wcscpy_s
'@ `
            @'
        findData.nFileSizeHigh = fileSize.HighPart;
        findData.nFileSizeLow = fileSize.LowPart;
        // Private AndroidDriveTime transport for ChangeTime.
        // AndroidDrive doesn't expose reparse points, so these reserved fields
        // are available to the matching patched dokan2.dll.
        findData.dwReserved0 = effectiveChangeTime.dwLowDateTime;
        findData.dwReserved1 = effectiveChangeTime.dwHighDateTime;
